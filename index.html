<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NodeSpace</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    /* ---- Electron 无边框窗口拖动区域 ---- */
    .fg-drag-region {
      -webkit-app-region: drag;
    }
    .fg-drag-region button,
    .fg-drag-region input,
    .fg-drag-region select,
    .fg-drag-region textarea,
    .fg-drag-region details,
    .fg-drag-region summary,
    .fg-drag-region [draggable] {
      -webkit-app-region: no-drag;
    }

    /* ---- Reset ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --fg-font-family: system-ui, -apple-system, sans-serif;
      --fg-color-scheme: dark;
    }
    html { color-scheme: var(--fg-color-scheme); }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--fg-font-family);
      color: var(--fg-text);
      transition: background var(--fg-transition, 0.25s ease);
    }

    #app {
      width: 100vw; height: 100vh; height: 100dvh;
      transition: background var(--fg-transition, 0.25s ease);
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 拖拽节点时，所有浮动 UI 穿透鼠标事件到下方画布 */
    .is-dragging-node .fg-glass,
    .is-dragging-node .fg-glass-elevated,
    .is-dragging-node .fg-mobile-toolbar {
      pointer-events: none !important;
    }

    /* ---- Mobile touch adaptation ---- */
    canvas {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .fg-glass, .fg-glass-elevated {
      touch-action: manipulation;
    }
    button, input, select, textarea, [contenteditable] {
      user-select: auto;
      -webkit-user-select: auto;
    }

    /* ---- CSS Variable Defaults (generic-dark fallback) ---- */
    :root {
      --fg-canvas-bg: #2a2a2a;
      --fg-surface: #3f3f3f;
      --fg-surface-glass: rgba(63,63,63,0.65);
      --fg-surface-elevated: rgba(63,63,63,0.85);
      --fg-text: #ffffff;
      --fg-text-muted: #a0a0a0;
      --fg-text-dim: #666666;
      --fg-border: #7e7e7e;
      --fg-border-light: rgba(255,255,255,0.08);
      --fg-input-bg: #3f3f3f;
      --fg-input-text: #ffffff;
      --fg-input-border: #7e7e7e;
      --fg-button-bg: #545454;
      --fg-button-text: #ffffff;
      --fg-button-hover: #5e5e5e;
      --fg-accent: #5B8FF9;
      --fg-accent-hover: #4a7ce0;
      --fg-accent-text: #ffffff;
      --fg-danger: #e03030;
      --fg-danger-hover: #c52828;
      --fg-success: #4CAF50;
      --fg-warning: #FF9800;
      --fg-shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --fg-shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --fg-shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --fg-glass-blur: 14px;
      --fg-glass-blur-sm: 6px;
      --fg-glass-blur-md: 12px;
      --fg-glass-blur-lg: 20px;
      --fg-glass-border: rgba(255,255,255,0.08);
      --fg-radius-sm: 6px;
      --fg-radius-md: 10px;
      --fg-radius-lg: 14px;
      --fg-label-width: 110px;
      --fg-input-number-width: 55px;
      --fg-line-height: 1.5;
      --fg-font-xxs: 0.68em;
      --fg-font-xs: 0.75em;
      --fg-font-sm: 0.84em;
      --fg-font-md: 0.88em;
      --fg-font-lg: 0.95em;
      --fg-font-xl: 1.15em;
      --fg-transition-fast: 0.15s ease;
      --fg-transition: 0.25s ease;
      --fg-scrollbar-thumb: rgba(255,255,255,0.15);
      --fg-scrollbar-thumb-hover: rgba(255,255,255,0.3);
      --fg-sidebar-bg: #3f3f3f;
      --fg-sidebar-border: #7e7e7e;
      --fg-sidebar-header-text: #ffffff;
      --fg-sidebar-item-hover: #4a4a4a;
      --fg-sidebar-item-active: #505050;
      --fg-tab-inactive: #a0a0a0;
      --fg-tab-active-bg: #3f3f3f;
      --fg-tab-active-border: #7e7e7e;
    }

    /* ---- Shared component styles ---- */

    /* Glass panel — sidebar, floating bars, panels */
    .fg-glass {
      background: var(--fg-surface-glass);
      backdrop-filter: blur(var(--fg-glass-blur));
      -webkit-backdrop-filter: blur(var(--fg-glass-blur));
      border: 1px solid var(--fg-glass-border);
      border-radius: var(--fg-radius-md);
      color: var(--fg-text);
      transition: background var(--fg-transition), border-color var(--fg-transition), color var(--fg-transition);
    }

    /* Elevated glass — modals, dialogs */
    .fg-glass-elevated {
      background: var(--fg-surface-elevated);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--fg-glass-border);
      border-radius: var(--fg-radius-lg);
      color: var(--fg-text);
      box-shadow: var(--fg-shadow-lg);
      transition: background var(--fg-transition), border-color var(--fg-transition), color var(--fg-transition);
    }

    /* Buttons */
    button, .fg-btn {
      font-size: var(--fg-font-md);
      padding: 4px 12px;
      border-radius: var(--fg-radius-sm);
      border: 1px solid var(--fg-border);
      background: var(--fg-button-bg);
      color: var(--fg-button-text);
      cursor: pointer;
      transition: background var(--fg-transition-fast), color var(--fg-transition-fast),
                  border-color var(--fg-transition-fast), box-shadow var(--fg-transition-fast);
      box-shadow: var(--fg-shadow-sm);
      line-height: 1.4;
    }
    button:hover, .fg-btn:hover {
      background: var(--fg-button-hover);
    }

    /* Inputs & selects */
    input, select, textarea {
      font-size: var(--fg-font-md);
      padding: 3px 8px;
      border-radius: var(--fg-radius-sm);
      border: 1px solid var(--fg-input-border);
      background: var(--fg-input-bg);
      color: var(--fg-input-text);
      transition: background var(--fg-transition-fast), color var(--fg-transition-fast),
                  border-color var(--fg-transition-fast);
    }
    select, option, optgroup {
      color: var(--fg-input-text);
      background-color: var(--fg-input-bg);
    }
    select:disabled, option:disabled, optgroup:disabled {
      color: var(--fg-text-dim);
    }
    input::placeholder, textarea::placeholder {
      color: var(--fg-text-muted);
      opacity: 0.78;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--fg-accent);
      box-shadow: 0 0 0 1px var(--fg-accent);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    /* ---- 滑块轨道变细、强调色 ---- */
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      height: 6px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--fg-accent,#5B8FF9); border: 2px solid rgba(255,255,255,0.3);
      margin-top: -5px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--fg-accent,#5B8FF9); border: 2px solid rgba(255,255,255,0.3);
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px; border-radius: 1px; background: var(--fg-accent,#5B8FF9);
    }
    input[type="range"]::-moz-range-track {
      height: 2px; border-radius: 1px; border: none;
      background: var(--fg-accent,#5B8FF9);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--fg-scrollbar-thumb);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg-scrollbar-thumb-hover);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--fg-scrollbar-thumb) transparent;
    }

    /* ---- HarmonyOS / 非 WebKit 引擎降级 ---- */
    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .fg-glass {
        background: var(--fg-surface);
      }
      .fg-glass-elevated {
        background: var(--fg-surface);
      }
    }

    /* ---- NodeSpace interface system ---- */
    :root {
      --fg-control-h: 30px;
      --fg-panel-pad: 12px;
      --fg-ui-gap: 8px;
    }

    button, .fg-btn {
      min-height: var(--fg-control-h);
      padding: 5px 10px;
      border-color: var(--fg-border-light);
      box-shadow: none;
      font-weight: 520;
    }
    button:hover, .fg-btn:hover {
      border-color: color-mix(in srgb, var(--fg-accent) 45%, var(--fg-border-light));
    }
    button:active, .fg-btn:active { transform: translateY(1px); }
    button:focus-visible, .fg-btn:focus-visible,
    summary:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--fg-accent) 70%, transparent);
      outline-offset: 2px;
    }
    input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
      min-height: var(--fg-control-h);
      border-color: var(--fg-border-light);
    }

    .fg-glass {
      border-color: var(--fg-border-light);
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    /* Command center: tabs + one primary action row + an optional tool shelf. */
    .fg-command-center {
      gap: 5px !important;
      padding: 5px 8px 7px !important;
      border-radius: 12px !important;
    }
    .fg-tab-bar {
      min-height: 34px !important;
      padding: 0 2px 4px !important;
    }
    .fg-tabs { align-items: center !important; gap: 3px !important; }
    .fg-tab {
      flex: 0 1 180px !important;
      min-height: 28px;
      padding: 4px 10px !important;
      margin: 0 !important;
      border-radius: 8px !important;
    }
    .fg-tab.is-active {
      box-shadow: inset 0 -2px 0 var(--fg-accent);
    }
    .fg-primary-actions {
      display: flex !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      gap: 6px !important;
      min-width: 0;
      overflow: visible;
      scrollbar-width: none;
    }
    .fg-primary-actions::-webkit-scrollbar { display:none; }
    .fg-action { flex: 0 0 auto; white-space: nowrap; }
    .fg-action-primary {
      color: var(--fg-accent-text);
      background: var(--fg-accent);
      border-color: var(--fg-accent);
    }
    .fg-action-primary:hover { background: var(--fg-accent-hover); }
    .fg-action.is-active, .fg-action-toggle[aria-pressed="true"] {
      color: var(--fg-accent);
      border-color: var(--fg-accent);
      background: color-mix(in srgb, var(--fg-accent) 14%, var(--fg-button-bg));
    }
    .fg-toolbar-panel {
      position:relative;
      flex:0 0 auto;
      z-index:5;
    }
    .fg-toolbar-summary {
      -webkit-app-region:no-drag;
      display:inline-flex;
      align-items:center;
      min-height:var(--fg-control-h);
      padding:5px 10px;
      color:var(--fg-button-text);
      border:1px solid var(--fg-border-light);
      border-radius:var(--fg-radius-sm);
      background:var(--fg-button-bg);
      cursor:pointer;
      font-size:var(--fg-font-md);
      font-weight:520;
      line-height:1.4;
      list-style:none;
      white-space:nowrap;
    }
    .fg-toolbar-summary::-webkit-details-marker { display:none; }
    .fg-toolbar-summary:hover { background:var(--fg-button-hover); }
    .fg-toolbar-summary.is-active {
      color:var(--fg-accent);
      border-color:var(--fg-accent);
      background:color-mix(in srgb, var(--fg-accent) 14%, var(--fg-button-bg));
    }
    .fg-toolbar-popover {
      position:fixed;
      top:0;
      left:8px;
      max-width:calc(100vw - 16px);
      z-index:40;
      padding:8px;
      border:1px solid var(--fg-border-light);
      border-radius:10px;
      color:var(--fg-text);
      background:var(--fg-surface-elevated);
      box-shadow:var(--fg-shadow-lg);
      backdrop-filter:blur(var(--fg-glass-blur));
      -webkit-backdrop-filter:blur(var(--fg-glass-blur));
    }
    .fg-tools-content {
      display:flex;
      flex-direction:column;
      gap:8px;
      width:min(640px, calc(100vw - 32px));
    }
    .fg-layout-popover {
      width:min(760px, calc(100vw - 16px));
    }
    .fg-appearance-content {
      width:min(360px, calc(100vw - 16px));
      max-height:min(70vh, 680px);
      overflow:auto;
      padding:10px 14px 18px;
    }
    .fg-mode-switcher {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:3px;
      padding:2px;
      border:1px solid var(--fg-border-light);
      border-radius:8px;
      background:color-mix(in srgb, var(--fg-surface) 70%, transparent);
    }
    .fg-mode-pill {
      min-height:24px;
      display:inline-flex;
      align-items:center;
      padding:2px 9px !important;
      border:1px solid transparent !important;
      border-radius:6px !important;
      color:var(--fg-text-muted);
    }
    .fg-mode-pill:hover { color:var(--fg-text); background:var(--fg-button-hover); }
    .fg-mode-pill.is-active {
      color:var(--fg-accent) !important;
      border-color:color-mix(in srgb, var(--fg-accent) 36%, transparent) !important;
      background:color-mix(in srgb, var(--fg-accent) 14%, transparent) !important;
    }
    .fg-view-toggle { border-style:dashed !important; }
    .fg-search-row { flex-wrap:nowrap !important; gap:5px !important; }
    .fg-search-row input { min-width:120px !important; }
    .fg-secondary-actions { gap:5px !important; }

    /* Sidebar: quiet navigation, stronger active state, less wasted width. */
    .fg-sidebar {
      border-radius:12px !important;
      transition:width var(--fg-transition), min-width var(--fg-transition);
    }
    .fg-sidebar-header {
      min-height:46px;
      padding:0 12px !important;
      transition:justify-content var(--fg-transition);
    }
    .fg-sidebar-title {
      display:inline-block;
      width:120px;
      min-width:0;
      overflow:hidden;
      white-space:nowrap;
      font-size:14px !important;
      letter-spacing:.01em !important;
      transition:width var(--fg-transition), opacity var(--fg-transition), visibility var(--fg-transition);
    }
    .fg-sidebar-collapse {
      width:28px;
      height:28px;
      min-width:28px !important;
      min-height:28px !important;
      flex:0 0 28px;
      padding:0 !important;
      border-radius:7px !important;
      box-shadow:none !important;
    }
    .fg-sidebar-content {
      transition:opacity var(--fg-transition), visibility var(--fg-transition);
    }
    .fg-sidebar-content-section {
      transition:opacity var(--fg-transition), visibility var(--fg-transition);
    }
    .fg-sidebar.is-collapsed .fg-sidebar-header {
      justify-content:center;
      padding:0 4px !important;
    }
    .fg-sidebar.is-collapsed .fg-sidebar-title {
      width:0;
      opacity:0;
      visibility:hidden;
    }
    .fg-sidebar.is-collapsed .fg-sidebar-content,
    .fg-sidebar.is-collapsed .fg-sidebar-content-section {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }
    .fg-sidebar-new-row { padding:7px 8px !important; }
    .fg-sidebar-new {
      min-height:32px !important;
      padding:0 9px !important;
      color:var(--fg-text) !important;
      border:1px dashed var(--fg-border-light) !important;
      border-radius:8px !important;
    }
    .fg-sidebar-new:hover { color:var(--fg-accent) !important; border-color:var(--fg-accent) !important; }
    .fg-file-tree { padding:7px 6px !important; }
    .fg-tree-directory, .fg-tree-file {
      min-height:30px;
      padding-top:5px !important;
      padding-bottom:5px !important;
      border-radius:7px;
      margin:1px 0;
    }
    .fg-tree-file.is-active {
      background:color-mix(in srgb, var(--fg-accent) 13%, transparent) !important;
      color:var(--fg-text) !important;
      border-left-color:var(--fg-accent) !important;
    }
    .fg-sidebar-settings-trigger { min-height:42px; padding:0 10px !important; }

    /* Node/edge inspector and application settings now share one panel language. */
    .fg-inspector {
      min-width:300px !important;
      max-width:360px !important;
      padding:14px !important;
      gap:10px !important;
      border-radius:14px !important;
      border-color:var(--fg-border-light) !important;
      background:var(--fg-surface-elevated) !important;
      box-shadow:var(--fg-shadow-lg) !important;
    }
    .fg-inspector input:not([type="range"]),
    .fg-inspector select,
    .fg-inspector textarea { width:100%; }
    .fg-settings-dialog {
      width:min(460px, calc(100vw - 32px)) !important;
      max-width:460px !important;
      padding:18px !important;
      border-radius:16px !important;
      border-color:var(--fg-border-light) !important;
      background:var(--fg-surface-elevated) !important;
    }
    .fg-dialog-titlebar {
      min-height:34px;
      margin-bottom:12px !important;
      padding-bottom:10px;
      border-bottom:1px solid var(--fg-border-light);
    }
    .fg-dialog-titlebar > div:first-child > div:first-child { display:none; }
    .fg-corner-tool { border-radius:9px !important; box-shadow:var(--fg-shadow-sm) !important; }
    .fg-console-panel { border-radius:12px !important; padding:10px !important; }
    .fg-status-line {
      right:82px !important;
      bottom:8px !important;
      max-width:calc(100vw - 100px);
      padding:3px 7px;
      border-radius:6px;
      background:color-mix(in srgb, var(--fg-surface) 75%, transparent);
    }

    @media (max-width: 720px) {
      :root { --fg-control-h:34px; }
      .fg-command-center { right:6px !important; }
      .fg-primary-actions {
        gap:5px !important;
        overflow-x:auto !important;
        overflow-y:hidden;
      }
      .fg-toolbar-popover {
        position:fixed;
        left:6px;
        right:6px;
        top:96px;
        width:auto;
        min-width:0;
        max-height:calc(100dvh - 108px);
        overflow:auto;
      }
      .fg-mode-switcher { flex-wrap:wrap; }
      .fg-search-row { flex-wrap:wrap !important; }
      .fg-search-row input { min-width:160px !important; flex:1; }
      .fg-inspector {
        right:6px !important;
        min-width:0 !important;
        width:min(340px, calc(100vw - 56px)) !important;
        max-width:calc(100vw - 56px) !important;
      }
      .fg-status-line { font-size:10px !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
